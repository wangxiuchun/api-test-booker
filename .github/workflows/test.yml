name: API自动化测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: 冒烟测试（核心链路）
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 创建reports目录
        run: mkdir -p reports

      - name: 运行冒烟测试
        run: pytest -m smoke --html=reports/smoke_report.html --self-contained-html -v

      - name: 上传冒烟测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: reports/smoke_report.html

  regression-test:
    name: 完整回归测试
    runs-on: ubuntu-latest
    needs: smoke-test

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 创建reports目录
        run: mkdir -p reports

      - name: 运行完整回归测试
        run: pytest -m regression --html=reports/regression_report.html --self-contained-html -v

      - name: 上传回归测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: reports/regression_report.html
